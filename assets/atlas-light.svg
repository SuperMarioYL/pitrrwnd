<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Architecture: Agent Workspace → Watcher/RedoLog → Snapshotter/Store → Audit Ledger">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- static connectors with arrowheads -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="210" y1="180" x2="255" y2="180" marker-end="url(#ah-l)"/>
    <line x1="425" y1="180" x2="470" y2="180" marker-end="url(#ah-l)"/>
    <line x1="640" y1="180" x2="685" y2="180" marker-end="url(#ah-l)"/>
  </g>

  <!-- marching-dash data flow (infinite loop, rightward = real data direction) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="180" x2="251" y2="180" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="425" y1="180" x2="466" y2="180" stroke="#10A37F" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="640" y1="180" x2="681" y2="180" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.0s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- animateMotion packet dots along each connector -->
  <g>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M210,180 L251,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M425,180 L466,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M640,180 L681,180" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes: breathing fill-opacity, staggered negative begin -->
  <g>
    <rect x="40"  y="140" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Agent Workspace</text>
    <text x="125" y="196" text-anchor="middle" font-size="10" fill="#6E6E73">files · config · state</text>

    <rect x="255" y="140" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="340" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Watcher · RedoLog</text>
    <text x="340" y="196" text-anchor="middle" font-size="10" fill="#6E6E73">fsnotify → .pitr/redo.wal</text>

    <rect x="470" y="140" width="170" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="555" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">Snapshotter · Store</text>
    <text x="555" y="196" text-anchor="middle" font-size="10" fill="#6E6E73">COW + sha256 manifest</text>

    <rect x="685" y="140" width="170" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="770" y="176" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">Audit Ledger</text>
    <text x="770" y="196" text-anchor="middle" font-size="10" fill="#6E6E73">.pitr/audit.jsonl (append-only)</text>
  </g>

  <!-- rewind back-arrow: Store restores the working set on rewind -->
  <g stroke="#6E6E73" stroke-width="1.2" fill="none" stroke-dasharray="3 4" opacity="0.55">
    <path d="M555,222 C555,276 125,276 125,222" marker-end="url(#ah-l)"/>
    <text x="340" y="276" text-anchor="middle" font-size="10" fill="#6E6E73">rewind — restore working set from snapshot</text>
  </g>
</svg>
